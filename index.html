<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<meta name="color-scheme" content="light only"><meta name="theme-color" content="#f8cb46">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--y:#f8cb46;--g:#0c831f;--g2:#16a34a;--ink:#1f2937;--mut:#6b7a90;--line:#e8edf4;--bg:#f4f6fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.06)}
header{flex:none;background:linear-gradient(180deg,#f8cb46,#fcd965);padding:10px 12px 10px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px}.top .logo{font-size:22px}.top b{font:900 17px Inter;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{margin-top:3px;font-size:12px;font-weight:600;color:#3d3a1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who b{font-weight:900;color:#000}
.srch{margin-top:8px;position:relative}.srch input{width:100%;border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:11px 12px 11px 36px;font:600 14px Inter;outline:none;background:#fff}
.srch:before{content:'🔍';position:absolute;left:11px;top:10px;font-size:15px}
.main{flex:1;display:grid;grid-template-columns:78px 1fr;min-height:0}
.side{overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding-bottom:90px;scrollbar-width:none}.side::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;cursor:pointer;position:relative;text-align:center;font-size:10.5px;font-weight:600;color:#4b5563;line-height:1.15}
.cat i{font-style:normal;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#f3f5f9;transition:.2s}
.cat.on{color:var(--g);font-weight:800}.cat.on i{background:#e7f6ea;transform:scale(1.06)}.cat.on:after{content:'';position:absolute;right:0;top:12px;bottom:12px;width:4px;border-radius:4px 0 0 4px;background:var(--g)}
.cat span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:70px;word-break:break-word}
.list{overflow-y:auto;background:var(--bg);padding:10px 8px 110px}
.lh{display:flex;align-items:baseline;gap:6px;padding:2px 4px 8px}.lh b{font:900 15px Inter}.lh small{color:var(--mut);font-size:11.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.pc{background:#fff;border-radius:14px;padding:6px 7px 8px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);min-width:0;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ph{aspect-ratio:1/1;border-radius:11px;display:grid;place-items:center;position:relative;font-size:44px}
.ph .w{position:absolute;bottom:5px;left:5px;color:#fff;font:800 9.5px Inter;padding:2px 6px;border-radius:6px}
.ph .t{position:absolute;top:5px;left:5px;background:#5b4cf0;color:#fff;font:800 8.5px Inter;padding:2px 5px;border-radius:5px}
.u{font-size:10.5px;color:var(--mut);font-weight:600}
.n{font-weight:700;font-size:12px;line-height:1.25;min-height:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:auto}.pr{font:900 13px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.pr small{display:block;font:600 9.5px Inter;color:var(--mut)}
.add{flex:none;border:1.3px solid var(--g2);color:var(--g);background:#f7fff9;font:900 12px Inter;padding:6px 13px;border-radius:9px;cursor:pointer}
.stp{flex:none;display:inline-flex;align-items:center;background:var(--g2);border-radius:9px;color:#fff}.stp button{background:none;border:0;color:#fff;font:800 16px Inter;width:24px;height:28px;cursor:pointer;padding:0}
.stp input{width:32px;border:0;background:transparent;color:#fff;text-align:center;font:900 12.5px Inter;outline:none;padding:0}
.more,.empty{grid-column:1/-1;text-align:center;color:var(--mut);font-size:12.5px;padding:14px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:800px;z-index:30;background:var(--g2);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(22,163,74,.45);cursor:pointer;animation:up .3s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}.bar small{display:block;opacity:.9;font-size:11.5px}.bar b{font-size:16px}.bar .go{margin-left:auto;font-weight:800;font-size:15px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(15,29,58,.45);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}@keyframes fd{from{opacity:0}}
.box{background:#fff;width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px max(18px,env(safe-area-inset-bottom));animation:sl .3s ease}@keyframes sl{from{transform:translateY(40px)}}
.box h2{margin:2px 0 8px;font:900 18px Inter}
.ln{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #f1f4fa}.ln .t{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none}
.ln .d{flex:1;min-width:0}.ln .d b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ln .d small{color:var(--mut);font-size:11px}
.x{border:0;background:#fee2e2;color:#b91c1c;border-radius:9px;width:28px;height:28px;cursor:pointer}
textarea,.in{width:100%;border:1px solid #d9e0ee;border-radius:11px;padding:9px 11px;font:14px Inter;margin-top:8px}
.tot{display:flex;align-items:center;margin-top:10px;font-size:12.5px;color:var(--mut)}.tot b{font-size:18px;margin-left:auto;color:var(--ink)}
.place{width:100%;margin-top:12px;border:0;border-radius:13px;padding:14px;font:900 15px Inter;color:#fff;background:linear-gradient(100deg,#0c831f,#22a447);cursor:pointer}.place:disabled{opacity:.6}
.ghost{background:#eef2f7;color:#334155}
.ok{text-align:center;padding:24px 8px}.ok .big{font-size:66px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(0)}}
.ok h2{font:900 22px Inter;margin:8px 0 4px}.ok p{color:#475569;font-size:14px}
.conf{position:fixed;top:-20px;width:9px;height:13px;border-radius:2px;z-index:60;animation:drop linear forwards}@keyframes drop{to{transform:translateY(110vh) rotate(720deg)}}
#load{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#fff8dc;font:800 16px Inter;color:var(--g)}
#load .b{font-size:52px;animation:bob 1.1s ease-in-out infinite;text-align:center}@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
#load .bar2{width:180px;height:6px;border-radius:6px;background:#efe6b8;overflow:hidden;margin:12px auto 0}#load .bar2 i{display:block;height:100%;width:40%;background:var(--g);border-radius:6px;animation:run 1.1s ease-in-out infinite}@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
</style></head><body>
<div id="load"><div style="text-align:center"><div class="b">🛒</div>Opening your order form…<div class="bar2"><i></i></div></div></div>
<div class="app">
<header><div class="top"><span class="logo">🛒</span><b id="co"></b></div><div class="who">Ordering for <b id="party"></b></div><div class="srch"><input id="q" placeholder="Search items…" autocomplete="off" enterkeyhint="search"></div></header>
<div class="main"><nav class="side" id="side"></nav><section class="list" id="list"></section></div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwlj52v_F6I_oF0FhnFl7vBSOCutDWdFt3Xvn_tfBWv00klb8wMxO7IhmuGKp3GP60o/exec';
const TOKEN = new URLSearchParams(location.search).get('o') || '';
const PAL = ['#6d5dfc','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6','#14b8a6','#f97316'];
const colOf = (s) => PAL[Math.abs([...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % PAL.length];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => `₹${inr.format(Number(n) || 0).replace(/\.00$/, '')}`;
const ICONS = [[/rice|basmati|paddy|bran|dhan|chawal|grain|wheat|atta|sella|kani|broken/, '🌾'], [/bag|bardana|jute|bopp|sack|pack|pouch|carton|box/, '🛍️'], [/oil|liquid|ghee|diesel|lubric/, '🛢️'], [/belt|spare|part|bearing|machin|motor|pump|bolt|gear|roller|sieve|screen/, '⚙️'], [/electric|wire|cable|bulb|light|switch|led|fan/, '💡'], [/flavou?r|essence|chemical|colou?r/, '🧪'], [/pipe|valve/, '🔧'], [/paper|label|sticker|print/, '🏷️'], [/sugar|salt|masala|spice|dal|pulse/, '🧂'], [/freight|transport/, '🚚']];
const icon = (t) => { t = String(t).toLowerCase(); for (const [re, ic] of ICONS) if (re.test(t)) return ic; return '📦'; };
const weight = (n) => { const m = /(\d+(?:\.\d+)?)\s*(kg|kgs|g|gm|ltr|l|ml|qtl)\b/i.exec(n); return m ? `${m[1]} ${m[2].toUpperCase()}` : ''; };
const clean = (n) => String(n).replace(/&#\d+;|[\r\n\t]+/g, ' ').replace(/^[\s\-]+/, '').replace(/\s{2,}/g, ' ').trim() || String(n);
(async () => {
let D;
try { D = await (await fetch(`${API}?api=form&o=${encodeURIComponent(TOKEN)}`)).json(); if (!D.ok) throw new Error(D.error || 'This order link is not valid'); }
catch (err) { document.getElementById('load').innerHTML = `<div style="text-align:center;padding:30px;color:#b91c1c">⚠️ ${esc(err.message || err)}<br><small style="color:#64748b">Please ask your supplier for a new order link.</small></div>`; return; }
document.title = `Order · ${D.company || ''}`;
const items = D.items.map((it, i) => ({ ...it, i, d: clean(it.n), ic: icon(`${it.n} ${it.g || ''}`) }));
const mineRate = new Map((D.mine || []).map(([k, r]) => [k, r]));
const mine = (D.mine || []).map(([k]) => items[k]).filter(Boolean);
const cart = new Map(); let group = mine.length ? '★' : '', q = '';
document.getElementById('co').textContent = D.company || 'Order form';
document.getElementById('party').textContent = D.party || 'Customer';
const rateOf = (it) => (mineRate.get(it.i) > 0 ? mineRate.get(it.i) : it.r) || 0;
const gcount = new Map(); for (const it of items) { const g = it.g || 'Other'; gcount.set(g, (gcount.get(g) || 0) + 1); }
const groups = [...gcount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 60);
const gIcon = new Map(groups.map(([g]) => [g, icon(`${g} ${items.find((x) => (x.g || 'Other') === g)?.n || ''}`)]));
function side() {
  const cats = [...(mine.length ? [['★', '⭐', 'Your items']] : []), ['', '🛒', 'All items'], ...groups.map(([g]) => [g, gIcon.get(g), g])];
  document.getElementById('side').innerHTML = cats.map(([k, ic, l]) => `<div class="cat ${group === k ? 'on' : ''}" data-g="${esc(k)}"><i>${ic}</i><span>${esc(clean(l))}</span></div>`).join('');
}
document.getElementById('side').onclick = (e) => { const c = e.target.closest('.cat'); if (!c) return; group = c.dataset.g; q = ''; document.getElementById('q').value = ''; side(); list(); document.getElementById('list').scrollTop = 0; };
const visible = () => { const w = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (w.length) return items.filter((it) => w.every((x) => `${it.n} ${it.a || ''} ${it.b || ''} ${it.g || ''}`.toLowerCase().includes(x)));
  if (group === '★') return mine; return group ? items.filter((it) => (it.g || 'Other') === group) : items; };
const step = (it) => { const v = cart.get(it.i); return v ? `<span class="stp"><button data-a="-">−</button><input data-a="q" inputmode="decimal" value="${v}"><button data-a="+">+</button></span>` : '<button class="add" data-a="+">ADD</button>'; };
function card(it, k) { const c = colOf(it.n), w = weight(it.n), r = rateOf(it), had = mineRate.has(it.i);
  return `<div class="pc" data-i="${it.i}" style="animation-delay:${Math.min(k, 16) * 15}ms"><div class="ph" style="background:linear-gradient(140deg,${c}26,${c}0d)">${it.ic}${w ? `<span class="w" style="background:${c}">${esc(w)}</span>` : ''}${had ? '<span class="t">ORDERED BEFORE</span>' : ''}</div>
  <span class="u">${it.u ? `per ${esc(it.u)}` : '&nbsp;'}</span><div class="n">${esc(it.d)}</div><div class="row"><span class="pr">${r > 0 ? money(r) : '<small>Rate on bill</small>'}${had && r > 0 ? '<small>your last rate</small>' : ''}</span>${step(it)}</div></div>`; }
function list() { const l = visible(); const title = q ? `Results for “${esc(q)}”` : group === '★' ? '⭐ Your items' : group ? esc(clean(group)) : 'All items';
  document.getElementById('list').innerHTML = `<div class="lh"><b>${title}</b><small>${l.length} item${l.length === 1 ? '' : 's'}</small></div><div class="grid">${l.length ? l.slice(0, 200).map(card).join('') + (l.length > 200 ? `<div class="more">Showing 200 of ${l.length} — search to find more</div>` : '') : '<div class="empty">No items here</div>'}</div>`; }
function setQ(i, v) { v = Math.max(0, Math.round((Number(v) || 0) * 1000) / 1000); if (v > 0) cart.set(i, v); else cart.delete(i); }
const L = document.getElementById('list');
L.onclick = (e) => { const b = e.target.closest('[data-a]'); if (!b || b.dataset.a === 'q') return; const c = b.closest('.pc'); const i = +c.dataset.i; setQ(i, (cart.get(i) || 0) + (b.dataset.a === '+' ? 1 : -1)); c.querySelector('.row').lastElementChild.outerHTML = step(items[i]); bar(); };
L.onchange = (e) => { if (e.target.dataset.a !== 'q') return; const c = e.target.closest('.pc'); setQ(+c.dataset.i, e.target.value); c.querySelector('.row').lastElementChild.outerHTML = step(items[+c.dataset.i]); bar(); };
document.getElementById('q').oninput = (e) => { q = e.target.value.trim(); list(); };
const total = () => [...cart.entries()].reduce((s, [i, v]) => s + v * rateOf(items[i]), 0);
function bar() { document.querySelector('.bar')?.remove(); if (!cart.size) return; const b = document.createElement('div'); b.className = 'bar';
  b.innerHTML = `<span style="font-size:20px">🛒</span><div><small>${cart.size} item${cart.size > 1 ? 's' : ''}</small><b>${money(total())}</b></div><span class="go">View cart ›</span>`; b.onclick = review; document.body.appendChild(b); }
function review() {
  const s = document.createElement('div'); s.className = 'sheet';
  const lines = () => [...cart.entries()].map(([i, v]) => { const it = items[i], r = rateOf(it), c = colOf(it.n); return `<div class="ln" data-i="${i}"><div class="t" style="background:${c}22">${it.ic}</div><div class="d"><b>${esc(it.d)}</b><small>${r > 0 ? `${money(r)} × ${v} ${esc(it.u || '')} = ${money(r * v)}` : `${v} ${esc(it.u || '')} · rate on bill`}</small></div><span class="stp"><button data-a="-">−</button><input data-a="q" inputmode="decimal" value="${v}"><button data-a="+">+</button></span><button class="x" data-a="x">✕</button></div>`; }).join('');
  s.innerHTML = `<div class="box"><h2>🧾 Your order</h2><div id="ls">${lines()}</div><div class="tot"><span>For <b style="font-size:12.5px;color:#1f2937">${esc(D.party)}</b> · + GST as applicable</span><b id="tt">${money(total())}</b></div>
    <textarea id="note" rows="2" placeholder="Note (delivery date, transport…) — optional"></textarea><input class="in" id="contact" placeholder="Your WhatsApp number (optional)" inputmode="tel">
    <button class="place" id="place">✅ Place order</button><button class="place ghost" id="back">← Add more items</button></div>`;
  document.body.appendChild(s);
  const upd = () => { s.querySelector('#ls').innerHTML = lines(); s.querySelector('#tt').textContent = money(total()); bar(); list(); if (!cart.size) s.remove(); };
  s.querySelector('#ls').onclick = (e) => { const b = e.target.closest('[data-a]'); if (!b || b.dataset.a === 'q') return; const i = +b.closest('.ln').dataset.i; setQ(i, b.dataset.a === 'x' ? 0 : (cart.get(i) || 0) + (b.dataset.a === '+' ? 1 : -1)); upd(); };
  s.querySelector('#ls').onchange = (e) => { if (e.target.dataset.a === 'q') { setQ(+e.target.closest('.ln').dataset.i, e.target.value); upd(); } };
  s.onclick = (e) => { if (e.target === s) s.remove(); }; s.querySelector('#back').onclick = () => s.remove();
  s.querySelector('#place').onclick = (e) => { const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Placing order…';
    const l = [...cart.entries()].map(([i, v]) => ({ n: items[i].n, q: v, u: items[i].u || '', r: rateOf(items[i]) }));
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'submit', o: TOKEN, lines: l, note: s.querySelector('#note').value, contact: s.querySelector('#contact').value }) })
      .then((x) => x.json()).then((r) => { if (!r.ok) throw new Error(r.error || 'Could not place the order');
        cart.clear(); bar(); list(); s.querySelector('.box').innerHTML = `<div class="ok"><div class="big">🎉</div><h2>Order placed!</h2><p>Order no <b>${esc(r.no)}</b> · ${r.items} item(s)${r.total ? ` · ${money(r.total)}` : ''}</p><p>${esc(D.company)} will confirm it on WhatsApp with your order PDF. Thank you! 🙏</p><button class="place" onclick="this.closest('.sheet').remove()">Done</button></div>`; confetti(); })
      .catch((err) => { btn.disabled = false; btn.textContent = '✅ Place order'; alert(err.message || err); }); };
}
function confetti() { for (let i = 0; i < 70; i++) { const c = document.createElement('i'); c.className = 'conf'; c.style.left = `${Math.random() * 100}vw`; c.style.background = PAL[i % PAL.length]; c.style.animationDuration = `${1.6 + Math.random() * 1.8}s`; c.style.animationDelay = `${Math.random() * .5}s`; document.body.appendChild(c); setTimeout(() => c.remove(), 4200); } }
side(); list(); document.getElementById('load').remove();
})();
</script></body></html>
